name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Build (-Werror)
        run: make CC=${{ matrix.cc }} EXTRA_CFLAGS=-Werror
      - name: Unit tests
        run: make test CC=${{ matrix.cc }} EXTRA_CFLAGS=-Werror
      - name: Reference log
        run: make run CC=${{ matrix.cc }}
      - name: ASan + UBSan
        run: make sanitize CC=${{ matrix.cc }}

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: cppcheck
        run: >
          cppcheck --std=c99 --enable=warning,style,performance,portability
          --error-exitcode=1 --quiet -Iinclude src tests
